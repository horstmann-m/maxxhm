# Region centroids, altitudes and harvest calendars. Month ranges (1-12) may
# wrap the year boundary. These windows drive the "what's in season now" map and
# the harvest calendar; they are typical/approximate and region-averaged.
# flavor_nodes reference flavor_wheel.yaml ids and power taste-match scoring.
regions:
